name: nest_admin
description: Nest admin portal (Flutter web).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  flutter: ^3.44.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.1
  intl: 0.20.3
  lucide_icons_flutter: 4.0.1
  nest_client:
    path: ../nest_client
  nest_shared:
    path: ../nest_shared
  riverpod_annotation: 4.0.7
  serverpod_auth_idp_client: 4.0.4
  serverpod_auth_idp_flutter: 4.0.4
  serverpod_flutter: 4.0.4

dev_dependencies:
  build_runner: 2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: 4.0.9

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/config.json
