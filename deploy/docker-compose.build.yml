# Builds the server and backup images from this repository instead of pulling it
# (for development of Nest itself; hosts use the published image):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# Run deploy/build-image.sh first, or the image has no web app.
services:
  nest:
    image: nest-server:local
    build:
      context: ..
      dockerfile: nest_server/Dockerfile
  backup:
    image: nest-backup:local
    build:
      context: backup
