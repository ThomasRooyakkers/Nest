# A Nest server: PostgreSQL, the Nest server (API and web app), a nightly
# database dump and, optionally, a Cloudflare Tunnel. Put this file and your
# .env (from .env.example) in one folder and run:
#   docker compose up -d
# See docs/hosting/hosting-guide.md (English) or hosting-guide.nl.md (Dutch).
name: nest

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nest
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nest"]
      interval: 10s
      timeout: 5s
      retries: 10

  nest:
    image: ${NEST_IMAGE:-ghcr.io/thomasrooyakkers/nest-server}:${NEST_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Host settings: this server's addresses and who may sign up.
      SERVERPOD_API_SERVER_PUBLIC_HOST: ${NEST_API_DOMAIN:?set in .env}
      SERVERPOD_WEB_SERVER_PUBLIC_HOST: ${NEST_WEB_DOMAIN:?set in .env}
      SERVERPOD_ALLOWED_ORIGINS: https://${NEST_WEB_DOMAIN}
      SERVERPOD_PASSWORD_superAdminEmail: ${SUPER_ADMIN_EMAIL:-}
      SERVERPOD_PASSWORD_signUpMode: ${SIGN_UP_MODE:-invite-only}
      # Secrets.
      SERVERPOD_DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      SERVERPOD_SERVICE_SECRET: ${SERVICE_SECRET:?set in .env}
      SERVERPOD_PASSWORD_emailSecretHashPepper: ${EMAIL_SECRET_HASH_PEPPER:?set in .env}
      SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey: ${JWT_HMAC_SHA512_PRIVATE_KEY:?set in .env}
      SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper: ${JWT_REFRESH_TOKEN_HASH_PEPPER:?set in .env}
      # Mail. Without both, sign-up and reset codes are written to the log.
      SERVERPOD_PASSWORD_resendApiKey: ${RESEND_API_KEY:-}
      SERVERPOD_PASSWORD_mailFrom: ${MAIL_FROM:-}
    # For your own https proxy: the API on 8080 and the web app on 8082, on
    # this machine only. The tunnel reaches the server inside Docker.
    ports:
      - "${NEST_BIND_ADDRESS:-127.0.0.1}:${NEST_API_PORT:-8080}:8080"
      - "${NEST_BIND_ADDRESS:-127.0.0.1}:${NEST_WEB_PORT:-8082}:8082"

  # Optional: Cloudflare Tunnel. Enable with COMPOSE_PROFILES=tunnel in .env.
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - nest

  # Nightly database dump into ./backups, keeping the last 14.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/nest-$$(date +%Y%m%d-%H%M%S).sql.gz
          pg_dump -h postgres -U postgres nest | gzip > "$$file.tmp" && mv "$$file.tmp" "$$file" && echo "backup: wrote $$file"
          ls -1t /backups/nest-*.sql.gz | tail -n +15 | xargs -r rm --
          sleep 86400
        done

volumes:
  pgdata:
