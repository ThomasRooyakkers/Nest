# A Nest server: PostgreSQL, the Nest server (API, web address and admin
# portal), daily backups and, optionally, a Cloudflare Tunnel. Put this
# file and your .env (from .env.example) in one folder and run:
#   docker compose up -d
# See docs/hosting/hosting-guide.md (English) or hosting-guide.nl.md (Dutch).
name: nest

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nest
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nest"]
      interval: 10s
      timeout: 5s
      retries: 10

  nest:
    image: ${NEST_IMAGE:-ghcr.io/thomasrooyakkers/nest-server}:${NEST_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Host settings: this server's addresses and who may sign up.
      SERVERPOD_API_SERVER_PUBLIC_HOST: ${NEST_API_DOMAIN:?set in .env}
      SERVERPOD_WEB_SERVER_PUBLIC_HOST: ${NEST_WEB_DOMAIN:?set in .env}
      SERVERPOD_ALLOWED_ORIGINS: https://${NEST_WEB_DOMAIN}${NEST_ADMIN_DOMAIN:+,https://${NEST_ADMIN_DOMAIN}}
      SERVERPOD_PASSWORD_adminDomain: ${NEST_ADMIN_DOMAIN:-}
      SERVERPOD_PASSWORD_superAdminEmail: ${SUPER_ADMIN_EMAIL:-}
      SERVERPOD_PASSWORD_signUpMode: ${SIGN_UP_MODE:-invite-only}
      # Secrets.
      SERVERPOD_DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      SERVERPOD_SERVICE_SECRET: ${SERVICE_SECRET:?set in .env}
      SERVERPOD_PASSWORD_emailSecretHashPepper: ${EMAIL_SECRET_HASH_PEPPER:?set in .env}
      SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey: ${JWT_HMAC_SHA512_PRIVATE_KEY:?set in .env}
      SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper: ${JWT_REFRESH_TOKEN_HASH_PEPPER:?set in .env}
      # Mail. Without both, sign-up and reset codes are written to the log.
      SERVERPOD_PASSWORD_resendApiKey: ${RESEND_API_KEY:-}
      SERVERPOD_PASSWORD_mailFrom: ${MAIL_FROM:-}
      # Film data for the watchlist. Without it, sample titles.
      SERVERPOD_PASSWORD_tmdbApiKey: ${TMDB_API_KEY:-}
      # Google and Apple sign-in in the iOS app. Each is off when not set.
      SERVERPOD_PASSWORD_googleClientSecret: ${GOOGLE_CLIENT_SECRET_JSON:-}
      SERVERPOD_PASSWORD_appleServiceId: ${APPLE_SERVICE_ID:-}
      SERVERPOD_PASSWORD_appleTeamId: ${APPLE_TEAM_ID:-}
      SERVERPOD_PASSWORD_appleKeyId: ${APPLE_KEY_ID:-}
      SERVERPOD_PASSWORD_appleKey: ${APPLE_KEY:-}
      SERVERPOD_PASSWORD_appleBundleId: ${APPLE_BUNDLE_ID:-}
    # For your own https proxy: the API on 8080 and the web address on 8082, on
    # this machine only. The tunnel reaches the server inside Docker.
    ports:
      - "${NEST_BIND_ADDRESS:-127.0.0.1}:${NEST_API_PORT:-8080}:8080"
      - "${NEST_BIND_ADDRESS:-127.0.0.1}:${NEST_WEB_PORT:-8082}:8082"

  # Optional: Cloudflare Tunnel. Enable with COMPOSE_PROFILES=tunnel in .env.
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - nest

  # Daily backup with restic (and "Back up now" from the admin portal) into
  # the targets of BACKUP_TARGETS: by default ./backups/restic. See
  # deploy/backup/backup.sh and the hosting guide.
  backup:
    image: ${NEST_BACKUP_IMAGE:-ghcr.io/thomasrooyakkers/nest-backup}:${NEST_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: nest
      PGPASSWORD: ${DATABASE_PASSWORD}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set in .env}
      BACKUP_TARGETS: ${BACKUP_TARGETS:-local=/backups/restic}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      TZ: ${TZ:-UTC}
    volumes:
      - ./backups:/backups
      # A second folder, e.g. an NFS share mounted on this machine.
      - ${BACKUP_EXTRA_DIR:-./backups}:/backups-extra
      # rclone remotes (OneDrive and others): rclone.conf in this folder.
      - ./rclone:/config/rclone

volumes:
  pgdata:
