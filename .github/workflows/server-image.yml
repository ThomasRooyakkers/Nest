name: Server image

# Builds the Nest server image (web app included) for arm64 and amd64 and
# publishes it to ghcr.io/<owner>/nest-server. Runs for a version tag that
# matches nestServerVersion, e.g. v0.2.0, or by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'

      - name: Install dependencies
        run: flutter pub get

      - name: Check the tag matches the server version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n "s/^const nestServerVersion = '\(.*\)';/\1/p" \
            nest_server/lib/src/endpoints/health_endpoint.dart)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match nestServerVersion $version"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        # Image names must be lower case; the owner may not be.
        run: |
          export IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nest-server"
          deploy/build-image.sh --push
