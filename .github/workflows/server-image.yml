name: Server image

# Builds the Hoomly server image (admin portal included) and the
# backup image for arm64 and amd64 and publishes them to
# ghcr.io/<owner>/hoomly-server and ghcr.io/<owner>/hoomly-backup. The same
# images are also tagged under the old names nest-server and nest-backup, so
# servers whose .env names those keep getting releases. Runs for a version tag
# that matches nestServerVersion, e.g. v0.2.0, or by hand.
#
# Each architecture builds on its own native runner (no QEMU emulation, which
# made the arm64 build take most of ten minutes) with a layer cache; the
# admin portal is built once and shared.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Server version
        id: version
        run: |
          version=$(sed -n "s/^const nestServerVersion = '\(.*\)';/\1/p" \
            nest_server/lib/src/endpoints/health_endpoint.dart)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match nestServerVersion $version"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build the admin portal
        run: deploy/build-image.sh --web

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: nest_server/web
          retention-days: 1

  image:
    needs: web
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: nest_server/web

      - name: Image names
        id: names
        # Image names must be lower case; the owner may not be.
        run: |
          # Each image is pushed under its name and its old name (until 0.18.0)
          # so servers whose .env names nest-server / nest-backup keep updating.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "server=ghcr.io/$owner/hoomly-server,ghcr.io/$owner/nest-server" >> "$GITHUB_OUTPUT"
          echo "backup=ghcr.io/$owner/hoomly-backup,ghcr.io/$owner/nest-backup" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Server image
        id: server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nest_server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: NEST_VERSION=${{ needs.web.outputs.version }}
          outputs: type=image,"name=${{ steps.names.outputs.server }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}

      - name: Backup image
        id: backup
        uses: docker/build-push-action@v6
        with:
          context: deploy/backup
          platforms: linux/${{ matrix.arch }}
          build-args: NEST_VERSION=${{ needs.web.outputs.version }}
          outputs: type=image,"name=${{ steps.names.outputs.backup }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=backup-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backup-${{ matrix.arch }}

      - name: Keep the digests
        run: |
          mkdir -p digests
          echo "${{ steps.server.outputs.digest }}" > digests/server-${{ matrix.arch }}
          echo "${{ steps.backup.outputs.digest }}" > digests/backup-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests
          retention-days: 1

  publish:
    needs: [web, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both architectures as one image
        env:
          VERSION: ${{ needs.web.outputs.version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          # Both names hold the same per-architecture images (pushed by the
          # image jobs), so each name is tagged from its own copies.
          for image in server backup; do
            for prefix in hoomly nest; do
              name="ghcr.io/$owner/$prefix-$image"
              docker buildx imagetools create \
                -t "$name:$VERSION" -t "$name:latest" \
                "$name@$(cat digests/$image-amd64)" \
                "$name@$(cat digests/$image-arm64)"
              docker buildx imagetools inspect "$name:$VERSION"
            done
          done
