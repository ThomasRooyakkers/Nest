# Production on the Raspberry Pi (deploy/docker-compose.yml). Cloudflare
# Tunnel terminates https: nest.g3cko.be serves the web app (web server),
# nest-api.g3cko.be the API. Secrets come from environment variables
# (deploy/.env on the Pi), never from this file.

# Configuration for the main API server.
apiServer:
  port: 8080
  publicHost: nest-api.g3cko.be
  publicPort: 443
  publicScheme: https

# Insights stays inside the Docker network (not routed by the tunnel).
insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8081
  publicScheme: http

# Serves the Flutter web app from web/app.
webServer:
  port: 8082
  publicHost: nest.g3cko.be
  publicPort: 443
  publicScheme: https

database:
  host: postgres
  port: 5432
  name: nest
  user: postgres
  requireSsl: false

maxRequestSize: 524288 # The maximum size of requests allowed in bytes

# Browsers may only call the API from the web app; the mobile apps send no
# Origin header and are not affected.
allowedOrigins:
  - https://nest.g3cko.be

sessionLogs:
  # Console logs are what `docker compose logs nest` shows. Until mail is set
  # up (resendApiKey), sign-up and reset codes appear there.
  consoleEnabled: true
  consoleLogFormat: text
